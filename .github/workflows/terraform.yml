name: Terraform CI/CD

on:
  # push:
  #   branches:
  #     - main
  #     - master
  # pull_request:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the Terraform changes'
        required: false
        default: false
        type: boolean

jobs:
  terraform:
    name: Terraform Plan and Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init
        run: terraform init
        working-directory: ./terraform-scripting

      - name: Terraform plan
        run: terraform plan -var="bucket_name=${{ vars.TF_BUCKET_NAME || 'my-terraform-practice-bucket' }}" -out=tfplan
        working-directory: ./terraform-scripting

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform-scripting

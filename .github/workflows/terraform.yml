name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose the Terraform action to run'
        required: true
        default: plan
        type: choice
        options:
          - validate
          - plan
          - apply
          - destroy
      bootstrap:
        description: 'Run bootstrap job to create backend resources'
        required: false
        default: false
        type: boolean

jobs:
  bootstrap:
    name: Bootstrap backend resources
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.bootstrap == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Bootstrap init
        run: terraform init
        working-directory: ./bootstrap

      - name: Bootstrap apply (create bucket + lock table)
        run: |
          terraform apply -auto-approve \
            -var="bucket_name=pihu-terraform-state-bucket" \
            -var="dynamodb_table_name=terraform-locks" \
            -var="aws_region=${{ vars.AWS_REGION || 'us-east-1' }}"
        working-directory: ./bootstrap

  terraform:
    name: Terraform action
    runs-on: ubuntu-latest
    needs: [bootstrap]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform init
        run: terraform init
        working-directory: .

      - name: Terraform validate
        if: ${{ inputs.action == 'validate' || inputs.action == 'apply' }}
        run: terraform validate
        working-directory: .

      - name: Terraform plan
        if: ${{ inputs.action == 'plan' || inputs.action == 'apply' }}
        run: terraform plan -var-file=terraform.tfvars -out=tfplan
        working-directory: .

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve tfplan
        working-directory: .

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
        working-directory: .
